<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game App</title>
  <style>
    /* Global Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Main Menu Screen Overhaul */
    #main-menu {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 30px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      position: relative;
      animation: fadeIn 0.6s ease-out;
    }

    .title-container {
      margin-bottom: 30px;
    }

    .main-title {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 6s ease infinite;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #a0a0c0;
      margin-top: 5px;
    }

    /* Action Buttons */
    .menu-actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 25px;
    }

    .btn {
      background: #48dbfb;
      color: #1e1e2f;
      border: none;
      padding: 16px 24px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      box-shadow: 0 6px 15px rgba(72, 219, 251, 0.3);
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 20px rgba(72, 219, 251, 0.4);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .btn-host {
      background: linear-gradient(135deg, #ff9ff3, #feca57);
      color: #1e1e2f;
      box-shadow: 0 6px 15px rgba(255, 159, 243, 0.3);
    }

    .btn-host:hover {
      box-shadow: 0 10px 20px rgba(255, 159, 243, 0.4);
    }

    .btn-join {
      background: linear-gradient(135deg, #48dbfb, #1dd1a1);
      color: #1e1e2f;
      box-shadow: 0 6px 15px rgba(72, 219, 251, 0.3);
    }

    .btn-join:hover {
      box-shadow: 0 10px 20px rgba(72, 219, 251, 0.4);
    }

    /* Audio Toggle Switch */
    .audio-control-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px 18px;
      border-radius: 50px;
      margin-top: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .audio-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #dcdde1;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #485460;
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #1dd1a1;
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* Gameplay Area & Safe Animations */
    #game-area {
      display: none;
      width: 90%;
      max-width: 600px;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    .game-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      position: relative;
    }

    /* Subtle pulse animation for game elements (Visual only, no layout shift) */
    .animated-game-element {
      animation: subtlePulse 3s ease-in-out infinite;
    }

    /* Floating visual accents in main screen background */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      z-index: -1;
      opacity: 0.5;
    }

    .shape-1 {
      width: 200px;
      height: 200px;
      background: #ff6b6b;
      top: -50px;
      left: -50px;
    }

    .shape-2 {
      width: 250px;
      height: 250px;
      background: #48dbfb;
      bottom: -60px;
      right: -60px;
    }

    /* Keyframe Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes subtlePulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.015); box-shadow: 0 0 15px rgba(255, 255, 255, 0.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Main Menu -->
  <div id="main-menu">
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="title-container">
      <h1 class="main-title">Game Time!</h1>
      <p class="subtitle">Select an option to get started</p>
    </div>

    <div class="menu-actions">
      <button class="btn btn-host" onclick="hostGame()">Host Game</button>
      <button class="btn btn-join" onclick="joinGame()">Join Game</button>
    </div>

    <div class="audio-control-container">
      <span class="audio-label">Audio Commentary</span>
      <label class="switch">
        <input type="checkbox" id="audio-toggle" checked onchange="toggleAudio(this.checked)">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Gameplay Screen -->
  <div id="game-area">
    <div class="game-card animated-game-element">
      <h2>Game Session Active</h2>
      <p style="margin-top: 15px; color: #a0a0c0;">Gameplay in progress...</p>
      <button class="btn" style="margin-top: 20px;" onclick="triggerVoiceCommentary()">Trigger Announcer</button>
      <button class="btn" style="margin-top: 10px; background: #ff6b6b; color: white;" onclick="returnToMenu()">Main Menu</button>
    </div>
  </div>

  <script>
    let audioEnabled = true;
    let selectedVoice = null;

    // Quirky/Silly voice lines for the character
    const voiceLines = [
      "Alright, absolute masterpiece of a move! ...Or complete accident, I can't tell.",
      "Beep boop! Just checking in to make sure you're still awake over there.",
      "Bold strategy! Let's see if it works out, or if we end up crying about it later.",
      "Whoa, easy there champion! Save some talent for the rest of us.",
      "Did you mean to do that? No judgments here, just highly suspicious."
    ];

    function toggleAudio(enabled) {
      audioEnabled = enabled;
      if (audioEnabled) {
        speak("Audio enabled! Let's do this!");
      } else {
        window.speechSynthesis.cancel();
      }
    }

    // Initialize Natural Male Voice Selection
    function initVoice() {
      const voices = window.speechSynthesis.getVoices();
      
      // Preferred order for natural-sounding male voices across major platforms
      const preferredVoices = [
        "Google UK English Male",
        "Google US English",
        "Microsoft Guy Online (Natural)",
        "Microsoft David - English (United States)",
        "Daniel",
        "Alex"
      ];

      for (let name of preferredVoices) {
        const found = voices.find(v => v.name.includes(name));
        if (found) {
          selectedVoice = found;
          break;
        }
      }

      // Fallback: pick any English voice marked male or the first available English voice
      if (!selectedVoice) {
        selectedVoice = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('male')) 
                     || voices.find(v => v.lang.startsWith('en')) 
                     || voices[0];
      }
    }

    if (typeof speechSynthesis !== 'undefined') {
      window.speechSynthesis.onvoiceschanged = initVoice;
      initVoice();
    }

    // Speak function tuned for a pleasant, quirky personality
    function speak(text) {
      if (!audioEnabled || !('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel(); // Stop any active speech

      const utterance = new SpeechSynthesisUtterance(text);
      if (selectedVoice) utterance.voice = selectedVoice;

      // Pitch and pitch variations create the funny/pleasant voice dynamic
      utterance.rate = 1.05; // Slightly upbeat pacing
      utterance.pitch = 1.1; // Slightly expressive pitch

      window.speechSynthesis.speak(utterance);
    }

    function hostGame() {
      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('game-area').style.display = 'block';
      speak("Welcome to the host seat! Try not to ruin the game for everyone!");
    }

    function joinGame() {
      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('game-area').style.display = 'block';
      speak("You joined! Hopefully, you brought your secret winning powers with you.");
    }

    function triggerVoiceCommentary() {
      const randomLine = voiceLines[Math.floor(Math.random() * voiceLines.length)];
      speak(randomLine);
    }

    function returnToMenu() {
      document.getElementById('game-area').style.display = 'none';
      document.getElementById('main-menu').style.display = 'block';
      speak("Back to the main menu. Take a breath!");
    }
  </script>
</body>
</html>
