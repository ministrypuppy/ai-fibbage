<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party Game Arena</title>
  <style>
    :root {
      --bg-dark: #0f0c1b;
      --card-bg: #1d1836;
      --accent-pink: #ff2a75;
      --accent-cyan: #00f0ff;
      --accent-yellow: #ffe600;
      --text-main: #ffffff;
      --text-muted: #a09cb0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Impact', 'Arial Black', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow-x: hidden;
      padding-bottom: 80px; /* Space for sticky footer */
    }

    /* Subtle Animated Background Grid */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -1;
      animation: moveGrid 20s linear infinite;
    }

    @keyframes moveGrid {
      0% { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    /* Top Bar & Timer */
    header {
      width: 100%;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .timer-container {
      background: var(--card-bg);
      border: 3px solid var(--accent-pink);
      border-radius: 50px;
      padding: 10px 30px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 0 15px rgba(255, 42, 117, 0.4);
      animation: pulseBorder 1.5s infinite alternate;
    }

    .timer-label {
      font-size: 1.2rem;
      color: var(--accent-pink);
      letter-spacing: 2px;
    }

    .timer-count {
      font-size: 2.5rem;
      color: var(--accent-yellow);
      text-shadow: 2px 2px #000;
    }

    /* Main Content Arena */
    main {
      width: 90%;
      max-width: 800px;
      margin: auto;
      text-align: center;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 40px 20px;
      border: 4px solid var(--accent-cyan);
      box-shadow: 8px 8px 0px var(--accent-pink);
      transform: translateY(0);
      animation: floatCard 4s ease-in-out infinite;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(0.5deg); }
    }

    .prompt-title {
      font-size: 1.2rem;
      color: var(--accent-cyan);
      letter-spacing: 3px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .prompt-text {
      font-size: 2.2rem;
      line-height: 1.2;
      color: var(--text-main);
      text-shadow: 3px 3px 0px #000;
    }

    /* Buttons / Interactive Elements */
    .action-btn {
      margin-top: 30px;
      background: var(--accent-yellow);
      color: #000;
      font-size: 1.5rem;
      padding: 15px 40px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 0 #b3a200;
      transition: all 0.1s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #b3a200;
    }

    .action-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b3a200;
    }

    /* Permanent Sticky Footer for Room Code */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(15, 12, 27, 0.95);
      border-top: 3px solid var(--accent-cyan);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(5px);
      z-index: 100;
    }

    .footer-title {
      font-size: 1rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
    }

    .room-code-badge {
      background: var(--accent-cyan);
      color: #000;
      font-size: 1.8rem;
      padding: 4px 16px;
      border-radius: 8px;
      letter-spacing: 4px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    /* Keyframe Animations */
    @keyframes pulseBorder {
      0% { box-shadow: 0 0 10px rgba(255, 42, 117, 0.4); }
      100% { box-shadow: 0 0 25px rgba(255, 42, 117, 0.8); }
    }
  </style>
</head>
<body>

  <!-- Top Timer -->
  <header>
    <div class="timer-container">
      <span class="timer-label">TIME</span>
      <span class="timer-count" id="timer">45</span>
    </div>
  </header>

  <!-- Main Game Stage -->
  <main>
    <div class="game-card">
      <p class="prompt-title">Current Prompt</p>
      <h1 class="prompt-text">"Explain a simple concept using only complete nonsense words."</h1>
      <button class="action-btn">Submit Answer</button>
    </div>
  </main>

  <!-- Persistent Host Footer -->
  <footer>
    <span class="footer-title">JOIN AT <strong>GAME.PARTY</strong></span>
    <div>
      <span class="footer-title" style="margin-right: 10px;">ROOM CODE:</span>
      <span class="room-code-badge">X9K2</span>
    </div>
  </footer>

</body>
</html>
