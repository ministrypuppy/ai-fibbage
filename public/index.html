<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erratic Law Enforcement Fibbage</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --accent: #ffb703;
            --text: #f8f9fa;
            --text-muted: #adb5bd;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 {
            color: var(--accent);
            text-align: center;
            margin-bottom: 25px;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .announcer-panel {
            background: linear-gradient(135deg, #212529, #343a40);
            border-left: 5px solid var(--accent);
            padding: 18px;
            border-radius: 6px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .announcer-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .announcer-text {
            font-style: italic;
            font-size: 1.05rem;
            line-height: 1.4;
        }
        .game-card {
            background-color: var(--card-bg);
            border: 1px solid #2d3238;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .question-text {
            font-size: 1.35rem;
            line-height: 1.6;
            font-weight: 500;
        }
        .blank {
            color: var(--accent);
            background-color: rgba(255, 183, 3, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px dashed var(--accent);
            font-family: monospace;
        }
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        button {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }
        button:hover {
            background-color: #fb8500;
            color: #fff;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <h1>🚨 Erratic Law Enforcement Fibbage 🚨</h1>

    <div class="announcer-panel">
        <div class="announcer-title">🎙️ Studio Announcer</div>
        <div class="announcer-text" id="announcerSpeech">"Welcome back, badge-chasers! Let's see what municipal madness our boys in blue walked into today."</div>
    </div>

    <div class="game-card">
        <div class="question-text" id="questionDisplay">Click below to start the chaos...</div>
    </div>

    <div class="controls">
        <button onclick="nextRound()">Next Erratic Question</button>
        <button onclick="speakAnnouncer()">🔊 Hear Announcer</button>
    </div>

    <script>
        // Unlimited / Diverse Erratic Templates with variable blank positions (Start, Middle, End)
        const templates = [
            // Blank at Beginning
            { template: "<span class='blank'>[__]</span> was discovered by state troopers hidden inside the spare tire compartment of a suspect's minivan during a routine midnight traffic stop.", announcer: "Nothing screams 'probable cause' quite like automotive upholstery stuffed with contraband." },
            { template: "<span class='blank'>[__]</span> served as the sole alibi for a confused motorist who tried to explain to highway patrol why he was driving backward down an interstate off-ramp.", announcer: "Bold legal strategy, Cotton. Let's see if it pays off in traffic court." },
            { template: "<span class='blank'>[__]</span> caused a massive three-hour standoff between local SWAT operators and an erratic raccoon barricaded inside a municipal utility shed.", announcer: "Negotiators brought trash bags and peanut butter, but negotiations broke down immediately." },

            // Blank in Middle
            { template: "A bewildered precinct captain in Ohio had to file an emergency report after a stray goat broke into the evidence locker and consumed <span class='blank'>[__]</span>.", announcer: "That's going to make a fascinating exhibit C for the prosecution." },
            { template: "Federal agents raiding an underground counterfeiting ring were stunned to discover the entire multimillion-dollar operation was financed entirely by <span class='blank'>[__]</span>.", announcer: "Who needs offshore bank accounts when you have pure unadulterated hustle?" },
            { template: "An overzealous security guard at a regional courthouse called 911 in a blind panic after mistaking <span class='blank'>[__]</span> for an active explosive device.", announcer: "Crisis averted, though the janitor's dignity took heavy casualties." },

            // Blank at End
            { template: "When a fleeing suspect tried to scale a barbed-wire fence to evade county sheriff deputies, he was ultimately subdued not by a K-9 unit, but by a swarm of <span class='blank'>[__]</span>.", announcer: "Mother Nature always handles her own law enforcement work." },
            { template: "British transport police had to shut down an entire underground station platform after an enraged commuter began aggressively swatting ticket inspectors with a <span class='blank'>[__]</span>.", announcer: "Standard London transit etiquette really has gone downhill." },
            { template: "Local municipal judges in New Mexico started sentencing repeat traffic offenders to spend every Saturday <span class='blank'>[__]</span>.", announcer: "That's community service with a heavy side of psychological torment." }
        ];

        let currentAnnouncerLine = "Welcome back, badge-chasers! Let's see what municipal madness our boys in blue walked into today.";

        function nextRound() {
            // Pick a random template
            const randomIndex = Math.floor(Math.random() * templates.length);
            const selected = templates[randomIndex];

            document.getElementById('questionDisplay').innerHTML = selected.template;
            document.getElementById('announcerSpeech').innerText = `"${selected.announcer}"`;
            currentAnnouncerLine = selected.announcer;
        }

        function speakAnnouncer() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any ongoing speech
                const utterance = new SpeechSynthesisUtterance(currentAnnouncerLine);
                utterance.pitch = 0.9; // Lower pitch for natural male voice profile
                utterance.rate = 1.0;
                
                // Try to select a natural-sounding English male voice if available
                const voices = window.speechSynthesis.getVoices();
                const maleVoice = voices.find(v => v.lang.startsWith('en') && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('george') || v.name.toLowerCase().includes('google us english')));
                if (maleVoice) {
                    utterance.voice = maleVoice;
                }

                window.speechSynthesis.speak(utterance);
            } else {
                alert("Speech synthesis not supported in this browser.");
            }
        }

        // Load initial question on page load
        window.onload = nextRound;
    </script>
</body>
</html>
