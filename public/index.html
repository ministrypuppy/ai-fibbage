<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dilemma Dash</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Main Menu Screen */
    #main-menu {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 30px;
      width: 90%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      position: relative;
      animation: fadeIn 0.5s ease-out;
    }

    .title-container {
      margin-bottom: 30px;
    }

    .main-title {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 6s ease infinite;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #a0a0c0;
      margin-top: 5px;
    }

    .menu-actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 25px;
    }

    .btn {
      background: #48dbfb;
      color: #1e1e2f;
      border: none;
      padding: 16px 24px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 15px rgba(72, 219, 251, 0.3);
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 20px rgba(72, 219, 251, 0.4);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .btn-host {
      background: linear-gradient(135deg, #ff9ff3, #feca57);
      color: #1e1e2f;
      box-shadow: 0 6px 15px rgba(255, 159, 243, 0.3);
    }

    .btn-join {
      background: linear-gradient(135deg, #48dbfb, #1dd1a1);
      color: #1e1e2f;
      box-shadow: 0 6px 15px rgba(72, 219, 251, 0.3);
    }

    .audio-control-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px 18px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .audio-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #dcdde1;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #485460;
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px; width: 18px;
      left: 4px; bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #1dd1a1;
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* Gameplay Screen */
    #game-area {
      display: none;
      width: 90%;
      max-width: 550px;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    .game-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: subtlePulse 4s ease-in-out infinite;
    }

    .question-box {
      font-size: 1.3rem;
      font-weight: 600;
      line-height: 1.5;
      color: #f1f2f6;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      border-left: 4px solid #ff9ff3;
    }

    .game-controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    /* Ambient shapes */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      z-index: -1;
      opacity: 0.4;
    }

    .shape-1 { width: 220px; height: 220px; background: #ff6b6b; top: -60px; left: -60px; }
    .shape-2 { width: 250px; height: 250px; background: #48dbfb; bottom: -70px; right: -70px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes subtlePulse {
      0% { box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
      50% { box-shadow: 0 10px 35px rgba(255, 159, 243, 0.15); }
      100% { box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    }
  </style>
</head>
<body>

  <!-- Main Menu -->
  <div id="main-menu">
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="title-container">
      <h1 class="main-title">Dilemma Dash</h1>
      <p class="subtitle">Infinite Adult Social Scenarios</p>
    </div>

    <div class="menu-actions">
      <button class="btn btn-host" onclick="hostGame()">Host Game</button>
      <button class="btn btn-join" onclick="joinGame()">Join Game</button>
    </div>

    <div class="audio-control-container">
      <span class="audio-label">Announcer Audio</span>
      <label class="switch">
        <input type="checkbox" id="audio-toggle" checked onchange="toggleAudio(this.checked)">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Gameplay Screen (Fixed Layout) -->
  <div id="game-area">
    <div class="game-card">
      <div id="question-display" class="question-box">
        Loading scenario...
      </div>

      <div class="game-controls">
        <button class="btn btn-join" onclick="generateNextQuestion()">Next Question</button>
        <button class="btn" style="background: #ff6b6b; color: #fff;" onclick="returnToMenu()">Main Menu</button>
      </div>
    </div>
  </div>

  <script>
    let audioEnabled = true;
    let selectedVoice = null;

    /* ANNOUNCER RANDOMIZED DIALOGUE ARRAYS */
    const hostLines = [
      "Welcome to the host seat! Try not to ruin the game for everyone.",
      "Look at you, running the show. Let's see how long this lasts.",
      "Hosting a session! Hope you brought your questionable decisions.",
      "Ah, the boss steps up. Let's get this party started!"
    ];

    const joinLines = [
      "You joined! Hopefully, you brought your secret winning powers.",
      "Welcome in! Prepare yourself for pure chaos.",
      "A new player enters! Let's see what you've got.",
      "You actually showed up! Alright, let's play."
    ];

    const menuLines = [
      "Back to safety. Coward.",
      "Main menu engaged. Take a breather.",
      "Escaping so soon? Fine, catch your breath."
    ];

    /* INFINITE ADULT QUESTION GENERATOR (Witty & Mature) */
    const subjects = [
      "your landlord", "your direct manager", "your high school rival", "your mother-in-law", 
      "your local HOA president", "your favorite coworker", "your ex’s new partner", "your accountant"
    ];

    const actions = [
      "accidentally replies-all with a brutally honest critique of",
      "catches you faking an elaborate excuse to skip",
      "discovers your secret, highly specific side hustle involving",
      "demands you publicly defend your controversial opinion on",
      "catches you eating their clearly labeled gourmet food in",
      "walks in on you having a heated full-blown debate with",
      "finds out you accidentally spent $500 of shared money on"
    ];

    const contexts = [
      "a mandatory corporate team building retreat.",
      "a high-stakes family holiday dinner.",
      "a crowded neighborhood block party.",
      "a professional networking event.",
      "a weekend group trip in a tiny Airbnb.",
      "a formal wedding reception during the speeches."
    ];

    const consequences = [
      "Do you double down and own it, or fabricate a chaotic lie?",
      "Who in the room do you immediately throw under the bus?",
      "How do you negotiate your way out of this without moving away?",
      "What is your immediate 5-second survival strategy?",
      "Do you apologize profusely or pretend it was an intentional power move?"
    ];

    const templates = [
      "Would you rather have {subject} read your unedited search history out loud, or spend 48 continuous hours with them on a road trip?",
      "You get $10,000 deposited tax-free, but {subject} gets to make one binding decision about your personal schedule every week. Do you take it?",
      "You are forced to explain {context} to {subject} using only hand gestures and severe eye contact. What's your opening move?",
      "If you had to trade bank accounts with {subject} right now, who gets the worse deal and why?"
    ];

    function getRandomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function generateQuestion() {
      if (Math.random() > 0.4) {
        const sub = getRandomItem(subjects);
        const act = getRandomItem(actions);
        const ctx = getRandomItem(contexts);
        const con = getRandomItem(consequences);
        return `During ${ctx}, ${sub} ${act} your personal life. ${con}`;
      } else {
        const tmpl = getRandomItem(templates);
        const sub = getRandomItem(subjects);
        const ctx = getRandomItem(contexts);
        return tmpl.replace('{subject}', sub).replace('{context}', ctx);
      }
    }

    function generateNextQuestion() {
      const q = generateQuestion();
      document.getElementById('question-display').innerText = q;
      speak(q);
    }

    /* VOICE SYNTHESIS ENGINE */
    function toggleAudio(enabled) {
      audioEnabled = enabled;
      if (audioEnabled) {
        speak("Audio back on! Let's get weird.");
      } else {
        window.speechSynthesis.cancel();
      }
    }

    function initVoice() {
      const voices = window.speechSynthesis.getVoices();
      const preferred = ["Google UK English Male", "Google US English", "Microsoft Guy Online (Natural)", "Daniel", "Alex"];

      for (let name of preferred) {
        const found = voices.find(v => v.name.includes(name));
        if (found) {
          selectedVoice = found;
          break;
        }
      }

      if (!selectedVoice) {
        selectedVoice = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('male')) 
                     || voices.find(v => v.lang.startsWith('en')) 
                     || voices[0];
      }
    }

    if (typeof speechSynthesis !== 'undefined') {
      window.speechSynthesis.onvoiceschanged = initVoice;
      initVoice();
    }

    function speak(text) {
      if (!audioEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      if (selectedVoice) utterance.voice = selectedVoice;
      utterance.rate = 1.05;
      utterance.pitch = 1.1;

      window.speechSynthesis.speak(utterance);
    }

    /* NAVIGATION LOGIC */
    function hostGame() {
      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('game-area').style.display = 'block';
      
      const intro = getRandomItem(hostLines);
      speak(intro);
      
      // Delay question voice slightly so host intro isn't cut off immediately
      setTimeout(() => {
        generateNextQuestion();
      }, 2500);
    }

    function joinGame() {
      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('game-area').style.display = 'block';
      
      const intro = getRandomItem(joinLines);
      speak(intro);
      
      setTimeout(() => {
        generateNextQuestion();
      }, 2500);
    }

    function returnToMenu() {
      document.getElementById('game-area').style.display = 'none';
      document.getElementById('main-menu').style.display = 'block';
      speak(getRandomItem(menuLines));
    }
  </script>
</body>
</html>
