<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fibbage Style Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Main Menu Screen */
    #main-menu {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 30px;
      width: 90%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      position: relative;
      animation: fadeIn 0.4s ease-out;
    }

    .title-container {
      margin-bottom: 30px;
    }

    .main-title {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 6s ease infinite;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #a0a0c0;
      margin-top: 5px;
    }

    .menu-actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 25px;
    }

    .btn {
      background: #48dbfb;
      color: #1e1e2f;
      border: none;
      padding: 16px 24px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 15px rgba(72, 219, 251, 0.3);
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 20px rgba(72, 219, 251, 0.4);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .btn-host {
      background: linear-gradient(135deg, #ff9ff3, #feca57);
      color: #1e1e2f;
      box-shadow: 0 6px 15px rgba(255, 159, 243, 0.3);
    }

    .btn-join {
      background: linear-gradient(135deg, #48dbfb, #1dd1a1);
      color: #1e1e2f;
      box-shadow: 0 6px 15px rgba(72, 219, 251, 0.3);
    }

    .audio-control-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px 18px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .audio-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #dcdde1;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #485460;
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px; width: 18px;
      left: 4px; bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #1dd1a1;
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* Gameplay Screen */
    #game-area {
      display: none;
      width: 90%;
      max-width: 580px;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    .game-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: subtlePulse 4s ease-in-out infinite;
    }

    .category-tag {
      display: inline-block;
      background: rgba(255, 159, 243, 0.2);
      color: #ff9ff3;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 159, 243, 0.3);
    }

    .question-box {
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.5;
      color: #f1f2f6;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      border-left: 4px solid #48dbfb;
    }

    .blank-highlight {
      color: #feca57;
      text-decoration: underline;
      font-weight: 800;
      padding: 0 4px;
    }

    .game-controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      z-index: -1;
      opacity: 0.4;
    }

    .shape-1 { width: 220px; height: 220px; background: #ff6b6b; top: -60px; left: -60px; }
    .shape-2 { width: 250px; height: 250px; background: #48dbfb; bottom: -70px; right: -70px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes subtlePulse {
      0% { box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
      50% { box-shadow: 0 10px 35px rgba(255, 159, 243, 0.15); }
      100% { box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    }
  </style>
</head>
<body>

  <!-- Main Menu -->
  <div id="main-menu">
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="title-container">
      <h1 class="main-title">Bluff & Blank</h1>
      <p class="subtitle">Obscure Facts & Fake Answers</p>
    </div>

    <div class="menu-actions">
      <button class="btn btn-host" onclick="startGame('host')">Host Game</button>
      <button class="btn btn-join" onclick="startGame('join')">Join Game</button>
    </div>

    <div class="audio-control-container">
      <span class="audio-label">Announcer Audio</span>
      <label class="switch">
        <input type="checkbox" id="audio-toggle" checked onchange="toggleAudio(this.checked)">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Gameplay Screen -->
  <div id="game-area">
    <div class="game-card">
      <div class="category-tag" id="category-display">Bizarre Laws</div>
      <div id="question-display" class="question-box">
        Loading statement...
      </div>

      <div class="game-controls">
        <button class="btn btn-join" onclick="nextFibbageQuestion()">Next Prompt</button>
        <button class="btn" style="background: #ff6b6b; color: #fff;" onclick="returnToMenu()">Main Menu</button>
      </div>
    </div>
  </div>

  <script>
    let audioEnabled = true;
    let selectedVoice = null;

    /* ANNOUNCER RANDOM DIALOGUE ARRAYS */
    const hostIntros = [
      "Alright host, try not to fall for your own fake answers.",
      "Look at you running the room. Let's see who can lie best.",
      "Session hosted! Time to fool your friends with absolute lies."
    ];

    const joinIntros = [
      "Welcome in! Get ready to write the most believable nonsense.",
      "You joined! Bring your best fake facts.",
      "A new challenger appears. Good luck spotting the truth."
    ];

    const menuIntros = [
      "Back to safety.",
      "Main menu engaged. Catch your breath."
    ];

    /* FIBBAGE-STYLE QUESTION BANK & GENERATOR ENGINE */
    const fibbageQuestions = [
      { cat: "Corporate Chaos", q: "In 2019, an office worker was formally reprimanded after accidentally sending an email containing ____ to the entire executive team." },
      { cat: "Strange History", q: "In 1912, a disgruntled landlord attempted to evict a tenant by releasing three dozen ____ into their living room." },
      { cat: "Wacky Laws", q: "In a small town in France, it is strictly illegal to name your pet pig ____." },
      { cat: "Workplace Disasters", q: "A man in Ohio was fired on his first day after trying to bribe his supervisor with ____." },
      { cat: "Suburban Politics", q: "A local HOA president called the police in 2021 because a neighbor's lawn ornament was wearing ____." },
      { cat: "Bizarre Crimes", q: "Police in Florida arrested a man who attempted to rob a drive-thru while carrying a live ____." },
      { cat: "Relationship Drama", q: "A couple broke off their engagement after arguing for six hours over the proper way to ____." },
      { cat: "Modern Hazards", q: "A luxury hotel guest was banned for life after attempting to cook ____ using the room's electric iron." },
      { cat: "Extreme Awkwardness", q: "During a formal dinner party, a guest panicked and hid ____ inside a potted plant." }
    ];

    // Procedural Generator for Endless Fibbage-Style Prompts
    const subjects = ["an overly ambitious manager", "a local HOA board member", "a disgruntled tenant", "a tech CEO", "an anonymous coworker", "a competitive neighbor"];
    const weirdEvents = [
      "was caught secretly replacing the office coffee with ____.",
      "got banned from a luxury resort for insisting on bringing ____ into the sauna.",
      "attempted to settle a heated argument by demanding a duel using ____.",
      "accidentally ordered $1,500 worth of ____ on a shared company credit card.",
      "tried to write off ____ as a legitimate business expense on their taxes."
    ];

    function getRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function generateFibbagePrompt() {
      if (Math.random() > 0.4) {
        return getRandom(fibbageQuestions);
      } else {
        const sub = getRandom(subjects);
        const evt = getRandom(weirdEvents);
        return {
          cat: "Dynamic Dilemma",
          q: `In 2023, ${sub} ${evt}`
        };
      }
    }

    function nextFibbageQuestion() {
      const item = generateFibbagePrompt();
      document.getElementById('category-display').innerText = item.cat;
      
      // Highlight the blank visually
      const formattedText = item.q.replace("____", '<span class="blank-highlight">__________</span>');
      document.getElementById('question-display').innerHTML = formattedText;
      
      // Speak the prompt naturally
      const spokenText = item.q.replace("____", "blank");
      speak(spokenText);
    }

    /* GAME FLOW CONTROLS */
    function startGame(mode) {
      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('game-area').style.display = 'block';

      const intro = (mode === 'host') ? getRandom(hostIntros) : getRandom(joinIntros);
      speak(intro);
      
      // Display first prompt immediately
      nextFibbageQuestion();
    }

    function returnToMenu() {
      document.getElementById('game-area').style.display = 'none';
      document.getElementById('main-menu').style.display = 'block';
      speak(getRandom(menuIntros));
    }

    /* VOICE SYNTHESIS */
    function toggleAudio(enabled) {
      audioEnabled = enabled;
      if (audioEnabled) {
        speak("Audio back on.");
      } else {
        window.speechSynthesis.cancel();
      }
    }

    function initVoice() {
      const voices = window.speechSynthesis.getVoices();
      const preferred = ["Google UK English Male", "Google US English", "Microsoft Guy Online (Natural)", "Daniel", "Alex"];

      for (let name of preferred) {
        const found = voices.find(v => v.name.includes(name));
        if (found) {
          selectedVoice = found;
          break;
        }
      }

      if (!selectedVoice) {
        selectedVoice = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('male')) 
                     || voices.find(v => v.lang.startsWith('en')) 
                     || voices[0];
      }
    }

    if (typeof speechSynthesis !== 'undefined') {
      window.speechSynthesis.onvoiceschanged = initVoice;
      initVoice();
    }

    function speak(text) {
      if (!audioEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      if (selectedVoice) utterance.voice = selectedVoice;
      utterance.rate = 1.05;
      utterance.pitch = 1.1;

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
