<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bluff & Blank</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Screen Panels */
    .screen {
      display: none;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 30px;
      width: 90%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      position: relative;
      animation: fadeIn 0.3s ease-out;
    }

    .screen.active {
      display: block;
    }

    .title-container {
      margin-bottom: 25px;
    }

    .main-title {
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 6s ease infinite;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #a0a0c0;
      margin-top: 5px;
    }

    .menu-actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 25px;
    }

    .btn {
      background: #48dbfb;
      color: #1e1e2f;
      border: none;
      padding: 16px 24px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 15px rgba(72, 219, 251, 0.3);
      width: 100%;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 8px 18px rgba(72, 219, 251, 0.4);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-host {
      background: linear-gradient(135deg, #ff9ff3, #feca57);
      color: #1e1e2f;
      box-shadow: 0 6px 15px rgba(255, 159, 243, 0.3);
    }

    .btn-join {
      background: linear-gradient(135deg, #48dbfb, #1dd1a1);
      color: #1e1e2f;
      box-shadow: 0 6px 15px rgba(72, 219, 251, 0.3);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      box-shadow: none;
      margin-top: 10px;
    }

    /* Form Inputs */
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #a0a0c0;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: #48dbfb;
    }

    .code-input {
      text-transform: uppercase;
      letter-spacing: 4px;
      text-align: center;
      font-size: 1.5rem;
    }

    /* Host Code Display */
    .code-box {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 8px;
      color: #feca57;
      background: rgba(0, 0, 0, 0.3);
      padding: 15px;
      border-radius: 16px;
      border: 2px dashed rgba(254, 202, 87, 0.5);
      margin: 20px 0;
    }

    /* Audio Toggle */
    .audio-control-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px 18px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .audio-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #dcdde1;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #485460;
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px; width: 18px;
      left: 4px; bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: #1dd1a1; }
    input:checked + .slider:before { transform: translateX(22px); }

    /* Gameplay Styling */
    .category-tag {
      display: inline-block;
      background: rgba(255, 159, 243, 0.2);
      color: #ff9ff3;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 159, 243, 0.3);
    }

    .question-box {
      font-size: 1.3rem;
      font-weight: 600;
      line-height: 1.5;
      color: #f1f2f6;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      border-left: 4px solid #48dbfb;
    }

    .blank-highlight {
      color: #feca57;
      text-decoration: underline;
      font-weight: 800;
      padding: 0 4px;
    }

    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      z-index: -1;
      opacity: 0.4;
    }

    .shape-1 { width: 220px; height: 220px; background: #ff6b6b; top: -60px; left: -60px; }
    .shape-2 { width: 250px; height: 250px; background: #48dbfb; bottom: -70px; right: -70px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body>

  <!-- Main Menu -->
  <div id="screen-main" class="screen active">
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="title-container">
      <h1 class="main-title">Bluff & Blank</h1>
      <p class="subtitle">Obscure Facts & Fake Answers</p>
    </div>

    <div class="menu-actions">
      <button class="btn btn-host" onclick="openHostLobby()">Host Game</button>
      <button class="btn btn-join" onclick="openJoinScreen()">Join Game</button>
    </div>

    <div class="audio-control-container">
      <span class="audio-label">Announcer Audio</span>
      <label class="switch">
        <input type="checkbox" id="audio-toggle" checked onchange="toggleAudio(this.checked)">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Host Lobby Screen -->
  <div id="screen-host" class="screen">
    <h2>Room Lobby</h2>
    <p class="subtitle">Share this code with your players:</p>
    
    <div class="code-box" id="generated-room-code">ABCD</div>

    <button class="btn btn-host" onclick="startGameplay()">Start Game</button>
    <button class="btn btn-secondary" onclick="showScreen('screen-main')">Cancel</button>
  </div>

  <!-- Join Game Screen -->
  <div id="screen-join" class="screen">
    <h2>Join Session</h2>
    <p class="subtitle" style="margin-bottom: 20px;">Enter details to enter room</p>

    <div class="input-group">
      <label>Your Name</label>
      <input type="text" id="player-name" class="input-field" placeholder="Player Name" maxlength="15">
    </div>

    <div class="input-group">
      <label>4-Letter Room Code</label>
      <input type="text" id="room-code-input" class="input-field code-input" placeholder="XXXX" maxlength="4" oninput="this.value = this.value.toUpperCase()">
    </div>

    <button class="btn btn-join" onclick="submitJoin()">Enter Room</button>
    <button class="btn btn-secondary" onclick="showScreen('screen-main')">Back</button>
  </div>

  <!-- Active Gameplay Screen -->
  <div id="screen-game" class="screen" style="max-width: 580px;">
    <div class="category-tag" id="category-display">Bizarre Laws</div>
    
    <div id="question-display" class="question-box">
      Loading statement...
    </div>

    <div style="display: flex; gap: 12px;">
      <button class="btn btn-join" onclick="nextFibbageQuestion()">Next Prompt</button>
      <button class="btn btn-secondary" style="margin-top:0;" onclick="showScreen('screen-main')">Menu</button>
    </div>
  </div>

  <script>
    let audioEnabled = true;
    let selectedVoice = null;

    /* ANNOUNCER VOICE LINES */
    const hostIntros = [
      "Welcome to the host seat! Try not to fall for your own lies.",
      "Lobby is open! Tell your friends to join in before we start.",
      "Host mode initialized. Let's get this room filled up."
    ];

    const joinIntros = [
      "Join screen ready. Put your name in and let's do this.",
      "Welcome! Enter the room code and prepare your best fake facts."
    ];

    const gameStartLines = [
      "Game starting! Time to bluff your way to victory.",
      "Here comes the first prompt. Try to look smart!"
    ];

    /* SCREEN ROUTER */
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    /* HOST GAME LOGIC */
    function openHostLobby() {
      // Generate 4-Letter Code
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let code = '';
      for (let i = 0; i < 4; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      
      document.getElementById('generated-room-code').innerText = code;
      showScreen('screen-host');
      speak(getRandom(hostIntros));
    }

    /* JOIN GAME LOGIC */
    function openJoinScreen() {
      document.getElementById('player-name').value = '';
      document.getElementById('room-code-input').value = '';
      showScreen('screen-join');
      speak(getRandom(joinIntros));
    }

    function submitJoin() {
      const name = document.getElementById('player-name').value.trim();
      const code = document.getElementById('room-code-input').value.trim();

      if (!name) {
        speak("Hey, enter your name first!");
        alert("Please enter your name.");
        return;
      }
      if (code.length !== 4) {
        speak("Room code needs to be exactly 4 letters!");
        alert("Please enter a valid 4-letter room code.");
        return;
      }

      startGameplay();
    }

    function startGameplay() {
      showScreen('screen-game');
      speak(getRandom(gameStartLines));
      nextFibbageQuestion();
    }

    /* FIBBAGE QUESTION GENERATOR */
    const fibbageQuestions = [
      { cat: "Corporate Chaos", q: "In 2019, an office worker was formally reprimanded after accidentally sending an email containing ____ to the entire executive team." },
      { cat: "Strange History", q: "In 1912, a disgruntled landlord attempted to evict a tenant by releasing three dozen ____ into their living room." },
      { cat: "Wacky Laws", q: "In a small town in France, it is strictly illegal to name your pet pig ____." },
      { cat: "Workplace Disasters", q: "A man in Ohio was fired on his first day after trying to bribe his supervisor with ____." },
      { cat: "Suburban Politics", q: "A local HOA president called the police in 2021 because a neighbor's lawn ornament was wearing ____." },
      { cat: "Bizarre Crimes", q: "Police in Florida arrested a man who attempted to rob a drive-thru while carrying a live ____." },
      { cat: "Relationship Drama", q: "A couple broke off their engagement after arguing for six hours over the proper way to ____." },
      { cat: "Modern Hazards", q: "A luxury hotel guest was banned for life after attempting to cook ____ using the room's electric iron." }
    ];

    const subjects = ["an overly ambitious manager", "a local HOA board member", "a disgruntled tenant", "a tech CEO", "an anonymous coworker", "a competitive neighbor"];
    const weirdEvents = [
      "was caught secretly replacing the office coffee with ____.",
      "got banned from a luxury resort for insisting on bringing ____ into the sauna.",
      "attempted to settle a heated argument by demanding a duel using ____.",
      "accidentally ordered $1,500 worth of ____ on a shared company credit card.",
      "tried to write off ____ as a legitimate business expense on their taxes."
    ];

    function getRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function nextFibbageQuestion() {
      let item;
      if (Math.random() > 0.4) {
        item = getRandom(fibbageQuestions);
      } else {
        item = {
          cat: "Dynamic Dilemma",
          q: `In 2023, ${getRandom(subjects)} ${getRandom(weirdEvents)}`
        };
      }

      document.getElementById('category-display').innerText = item.cat;
      const formattedText = item.q.replace("____", '<span class="blank-highlight">__________</span>');
      document.getElementById('question-display').innerHTML = formattedText;
      
      speak(item.q.replace("____", "blank"));
    }

    /* VOICE ENGINE */
    function toggleAudio(enabled) {
      audioEnabled = enabled;
      if (!audioEnabled) window.speechSynthesis.cancel();
    }

    function initVoice() {
      const voices = window.speechSynthesis.getVoices();
      const preferred = ["Google UK English Male", "Google US English", "Microsoft Guy Online (Natural)", "Daniel", "Alex"];

      for (let name of preferred) {
        const found = voices.find(v => v.name.includes(name));
        if (found) { selectedVoice = found; break; }
      }

      if (!selectedVoice) {
        selectedVoice = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('male')) 
                     || voices.find(v => v.lang.startsWith('en')) 
                     || voices[0];
      }
    }

    if (typeof speechSynthesis !== 'undefined') {
      window.speechSynthesis.onvoiceschanged = initVoice;
      initVoice();
    }

    function speak(text) {
      if (!audioEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      if (selectedVoice) utterance.voice = selectedVoice;
      utterance.rate = 1.05;
      utterance.pitch = 1.1;

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
